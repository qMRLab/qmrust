<!doctype html>
<meta charset="utf-8">
<title>qmrust playground</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px; background: #0d1117; color: #e6edf3;
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select, button { background: #161b22; color: #e6edf3; border: 1px solid #30363d;
                   border-radius: 6px; padding: 5px 9px; font: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: #9aa7b2; }
  .panels { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  figure { margin: 0; }
  figcaption { color: #9aa7b2; font-size: 11px; margin-top: 3px; }
  canvas { image-rendering: pixelated; border: 1px solid #30363d; border-radius: 4px;
           cursor: crosshair; }
  #fallback { border: 1px solid #30363d; border-radius: 6px; padding: 12px; }
  code { background: #161b22; padding: 1px 4px; border-radius: 3px; }
</style>
<div class="row">
  <label for="model">Model</label>
  <select id="model"></select>
  <button id="fit">Fit slice</button>
  <span id="status">loading…</span>
</div>
<div id="fallback" hidden>
  <p><strong>The WebAssembly build is not present.</strong> Build it, then reload:</p>
  <pre><code>cd crates/qmrust-wasm && wasm-pack build --target web --out-dir ../../docs/playground/pkg</code></pre>
</div>
<div class="panels" id="panels"></div>
<script type="module" src="./app.js"></script>
