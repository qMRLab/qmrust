[workspace]
resolver = "2"
members = ["crates/qmrust-core", "crates/qmrust-cli", "crates/qmrust-wasm", "crates/rust-bids"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/qmrlab/qmrust"
homepage = "https://qmrlab.org"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# `float_roundtrip` makes serde_json's float parser correctly rounded. Without
# it the parser is a fast approximation that lands one ulp off on 17-digit
# decimals, so a value written by serde_json does not read back identically —
# and volume identities (`InversionTime`, `EchoTime`, …) are matched by exact
# f64 equality against protocol values parsed by serde_yaml.
serde_json = { version = "1", features = ["float_roundtrip"] }
ndarray = "0.16"
rayon = "1"
anyhow = "1"
levenberg-marquardt = "0.15"
# Must match the nalgebra major that levenberg-marquardt builds against: the
# `LeastSquaresProblem` impls are keyed on nalgebra's dimension types, and two
# copies in the graph make them unsatisfiable.
nalgebra = "0.34"
# Seeded simulation only: no OS entropy source, so no `getrandom` on any target.
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.6"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
matfile = "0.5"
nifti = { version = "0.17", features = ["ndarray_volumes"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
owo-colors = { version = "4", features = ["supports-colors"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen-rayon = "1.2"
wasm-bindgen-test = "0.3"
proptest = "1"
